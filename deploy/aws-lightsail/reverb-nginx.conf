# WebSocket entry for Laravel Reverb (wss://ws.example.com).
# Point DNS ws.example.com at this instance, install a certificate with
# Certbot, then reload Nginx. Reverb itself listens on 127.0.0.1:6001
# via the smarteduconnect-reverb systemd service.
server {
    listen 443 ssl;
    server_name ws.example.com;

    # ssl_certificate /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# Optional: redirect plain HTTP to HTTPS once certificates exist.
# server {
#     listen 80;
#     server_name ws.example.com;
#     return 301 https://$host$request_uri;
# }
